<!doctype html>
<html lang="it">
  <head>
    <!--
      I valori di questa testata sono lo stato iniziale della pagina e restano
      quelli che leggono i crawler che non eseguono JavaScript (anteprime
      social). A runtime il sito li sostituisce con i valori di `profilo` in
      Directus se ci sono: vedi `src/lib/head.js`.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />

    <!--
      La Content-Security-Policy viene inserita **qui** al momento della build:
      contiene l'impronta dello script qui sotto e l'indirizzo del CMS, due
      valori che a scriverli a mano invecchiano in silenzio (basta cambiare
      l'indirizzo di Directus per far sparire tutti i contenuti, senza nessun
      errore che lo spieghi). La calcola `vite.config.js`.

      Il riferimento della pagina: senza, un sito esterno su cui si clicca riceve
      l'indirizzo completo della pagina da cui si arriva.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- csp -->
    <meta name="color-scheme" content="dark light" />

    <title>Gabriele Bassi — Cloud, sistemi e sicurezza</title>
    <meta
      name="description"
      content="Sistemista cloud e studente di cybersecurity. Infrastrutture Linux, homelab, automazione e sicurezza. Progetti, percorso e contatti."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gbassi.cc/" />
    <meta property="og:title" content="Gabriele Bassi — Cloud, sistemi e sicurezza" />
    <meta
      property="og:description"
      content="Sistemista cloud e studente di cybersecurity: infrastrutture Linux, homelab, automazione."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!--
      Il tema viene applicato prima del primo paint: senza questo script la
      pagina lampeggerebbe in dark prima di passare a light (FOUC).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gb-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
